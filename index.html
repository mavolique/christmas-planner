<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Christmas Planner">
<title>Christmas Planner by Mavolique</title>
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --ink:#26332c; --muted:#6f7a72; --line:#ece4d8;
  --pine:#2f4a3a; --pine-soft:#e6eee7; --berry:#b23a3a; --berry-soft:#f8e4e1;
  --gold:#c49a4a; --gold-soft:#f7edd8; --blush:#efd3c8; --shadow:0 6px 24px rgba(60,45,30,.08);
  --radius:18px; --font-head: Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
body.dark{
  --bg:#17201b; --card:#212c26; --ink:#eef1ec; --muted:#a3ada6; --line:#33413a;
  --pine:#8fb59b; --pine-soft:#2b3a31; --berry:#e07a72; --berry-soft:#3d2a28;
  --gold:#d9b46a; --gold-soft:#3a3324; --blush:#5a4038; --shadow:0 6px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-size:20px}
.brand b{font-family:var(--font-head);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px;font-weight:500}
.nav a:hover{background:var(--pine-soft)}
.nav a.active{background:var(--pine);color:#fff}
body.dark .nav a.active{color:#17201b}
.nav .ico{width:22px;text-align:center;font-size:17px}
.nav .badge{margin-left:auto;background:var(--berry);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:700}
.main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1150px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:30px}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:2px}
/* Cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3 .btn{font-family:var(--font-body)}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{background:linear-gradient(135deg,var(--pine) 0%,#3f604c 100%);color:#fff;border:none;position:relative;overflow:hidden}
body.dark .hero{background:linear-gradient(135deg,#2b4a37,#1f3528)}
.hero .big{font-family:var(--font-head);font-size:76px;line-height:1;font-weight:700}
.hero .lbl{text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.85}
.hero .msg{font-family:var(--font-head);font-size:22px;margin-top:4px}
.hero .snow{position:absolute;right:-10px;top:-10px;font-size:120px;opacity:.12;pointer-events:none}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .n{font-family:var(--font-head);font-size:30px;font-weight:700}
.stat .t{color:var(--muted);font-size:13px}
.stat .bar{margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine);border-radius:10px;transition:width .3s}
.bar.red i{background:var(--berry)} .bar.gold i{background:var(--gold)}
/* Buttons */
.btn{border:none;background:var(--pine);color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
body.dark .btn{color:#17201b}
.btn:hover{filter:brightness(1.08)}
.btn.red{background:var(--berry);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.iconbtn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);font-size:15px}
.iconbtn:hover{background:var(--pine-soft);color:var(--ink)}
/* Lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--pine);background:transparent;cursor:pointer;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:13px;padding:0}
.check.on{background:var(--pine)}
body.dark .check.on{color:#17201b}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.pill.red{background:var(--berry-soft);color:var(--berry)}
.pill.gold{background:var(--gold-soft);color:#8a6a24}
body.dark .pill.gold{color:var(--gold)}
.pill.grey{background:var(--line);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .e{font-size:38px;margin-bottom:6px}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.attn .row{cursor:pointer}
.attn .num{background:var(--gold-soft);color:#8a6a24;border-radius:10px;padding:2px 10px;font-weight:700;font-size:13px}
body.dark .attn .num{color:var(--gold)}
/* Ring */
.ringwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:130px;height:130px;flex-shrink:0}
.legend div{display:flex;justify-content:space-between;gap:20px;padding:3px 0;font-size:14px}
.legend span{color:var(--muted)}
/* Forms / modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal-bg.open{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:760px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.modal h2{font-size:22px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine)}
.field textarea{min-height:90px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
/* Recipes */
.rcard{cursor:pointer;transition:transform .15s}
.rcard:hover{transform:translateY(-2px)}
.rcard .course{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--berry);font-weight:700}
.rcard h4{font-family:var(--font-head);font-size:19px;margin:4px 0 6px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
.toggle .sw{width:38px;height:22px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.toggle .sw:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--berry)}
.toggle.on .sw:after{left:18px}
.aisle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--berry);font-weight:700;margin:16px 0 2px}
.ing-row{display:grid;grid-template-columns:70px 70px 1fr 30px;gap:6px;margin-bottom:6px}
.ing-row input{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0}
.tbl-total{display:flex;justify-content:space-between;padding:12px 4px 0;font-weight:700;border-top:2px solid var(--line);margin-top:4px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
.searchbox{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-width:180px}
/* Mobile nav */
.bottom{display:none}
.more-sheet a{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .side{display:none}
  .main{padding:18px 14px calc(100px + env(safe-area-inset-bottom))}
  .topbar h1{font-size:25px}
  .g2,.g3{grid-template-columns:1fr}
  .hero .big{font-size:60px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;padding:4px 6px;border-radius:10px;min-width:54px;position:relative}
  .bottom a .ico{font-size:20px}
  .bottom a.active{color:var(--berry)}
  .bottom .dot{position:absolute;top:0;right:8px;background:var(--berry);color:#fff;font-size:10px;border-radius:10px;padding:0 5px}
  .card{padding:15px}
  .searchbox{min-width:0;width:100%}
}
@media print{.side,.bottom,.btn,.iconbtn,.chips{display:none!important}.main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var KEY = "mavolique-christmas-planner-v1";
var storageOK = true;

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function num(v){ var n = parseFloat(String(v).replace(/,/g,"")); return isFinite(n) ? n : 0; }
function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return (n<10?"0":"")+n; }
function money(n){
  var c = state.settings.currency || "$";
  var v = Math.round(num(n)*100)/100;
  var neg = v < 0; v = Math.abs(v);
  var s = v.toLocaleString(undefined,{minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits:2});
  return (neg?"-":"") + c + s;
}
function fmtDate(s){
  if(!s) return "";
  var p = s.split("-"); if(p.length!==3) return s;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function fmtQty(q){
  if(!q) return "";
  var r = Math.round(q*100)/100;
  var whole = Math.floor(r), frac = Math.round((r-whole)*100)/100;
  var fr = {0.25:"¼",0.5:"½",0.75:"¾",0.33:"⅓",0.67:"⅔"}[frac];
  if(fr) return (whole?whole:"")+fr;
  return String(r);
}
function pct(a,b){ return b>0 ? Math.min(100, Math.round(a/b*100)) : 0; }

/* ---------- default data ---------- */
var TASK_CATS = ["Gifts","Food","Decorating","Cards","Hosting","Travel","Other"];
var COURSES = ["Starter","Main","Side","Dessert","Drinks","Breakfast"];
var AISLES = ["Produce","Meat & Fish","Dairy & Eggs","Bakery","Pantry","Spices","Frozen","Drinks","Other"];
var BUDGET_CATS = ["Gifts","Food","Decorations","Cards & Postage","Travel","Hosting","Other"];
var GIFT_STATUS = ["Idea","Bought","Wrapped","Given"];
var RSVP = ["Invited","Yes","Maybe","No"];

function seed(){
  return {
    version:1,
    settings:{ name:"", currency:"$", eventMonth:12, eventDay:25, cookingFor:8, totalBudget:800, dark:false, sample:true },
    budgetPlan:{ "Gifts":400, "Food":200, "Decorations":80, "Cards & Postage":30, "Travel":50, "Hosting":30, "Other":10 },
    tasks:[
      {id:uid(), text:"Make the Christmas gift list", cat:"Gifts", due:"", done:true},
      {id:uid(), text:"Set the holiday budget", cat:"Other", due:"", done:true},
      {id:uid(), text:"Order gifts that need delivery", cat:"Gifts", due:"", done:false},
      {id:uid(), text:"Put up the tree and lights", cat:"Decorating", due:"", done:false},
      {id:uid(), text:"Write and post Christmas cards", cat:"Cards", due:"", done:false},
      {id:uid(), text:"Plan the Christmas dinner menu", cat:"Food", due:"", done:false},
      {id:uid(), text:"Send dinner invitations", cat:"Hosting", due:"", done:false},
      {id:uid(), text:"Wrap all the presents", cat:"Gifts", due:"", done:false},
      {id:uid(), text:"Do the big grocery shop", cat:"Food", due:"", done:false},
      {id:uid(), text:"Clean the guest room", cat:"Hosting", due:"", done:false}
    ],
    gifts:[
      {id:uid(), person:"Mom", idea:"Cosy knitted scarf", budget:40, cost:35, status:"Bought", note:""},
      {id:uid(), person:"Dad", idea:"Coffee lover's set", budget:50, cost:0, status:"Idea", note:""},
      {id:uid(), person:"Sarah", idea:"Art supplies kit", budget:30, cost:28, status:"Wrapped", note:""}
    ],
    recipes:[
      {id:uid(), name:"Herb Roast Turkey", course:"Main", servings:8, onMenu:true, time:"4 hrs",
        ingredients:[{q:1,u:"",n:"whole turkey (5-6 kg)",a:"Meat & Fish"},{q:100,u:"g",n:"butter",a:"Dairy & Eggs"},{q:2,u:"",n:"lemons",a:"Produce"},{q:1,u:"bunch",n:"fresh thyme",a:"Produce"},{q:1,u:"head",n:"garlic",a:"Produce"},{q:2,u:"",n:"onions",a:"Produce"}],
        steps:"Heat the oven to 180°C / 350°F.\nMix soft butter with chopped thyme and crushed garlic, then rub it under and over the skin.\nStuff the cavity with lemon halves and onion.\nRoast about 20 minutes per 500 g, basting every hour.\nRest under foil for 30 minutes before carving."},
      {id:uid(), name:"Creamy Mashed Potatoes", course:"Side", servings:8, onMenu:true, time:"40 min",
        ingredients:[{q:2,u:"kg",n:"potatoes",a:"Produce"},{q:100,u:"g",n:"butter",a:"Dairy & Eggs"},{q:250,u:"ml",n:"milk",a:"Dairy & Eggs"},{q:1,u:"tsp",n:"salt",a:"Spices"}],
        steps:"Peel and chop the potatoes.\nBoil in salted water until soft, about 20 minutes.\nDrain, then mash with warm milk and butter.\nSeason to taste."},
      {id:uid(), name:"Orange Cranberry Sauce", course:"Side", servings:8, onMenu:true, time:"15 min",
        ingredients:[{q:350,u:"g",n:"fresh cranberries",a:"Produce"},{q:150,u:"g",n:"sugar",a:"Pantry"},{q:1,u:"",n:"orange",a:"Produce"}],
        steps:"Add cranberries, sugar, orange zest and juice to a pan.\nSimmer for 10 minutes until the berries burst.\nCool before serving."},
      {id:uid(), name:"Gingerbread Cookies", course:"Dessert", servings:24, onMenu:false, time:"1 hr",
        ingredients:[{q:350,u:"g",n:"flour",a:"Pantry"},{q:2,u:"tsp",n:"ground ginger",a:"Spices"},{q:1,u:"tsp",n:"cinnamon",a:"Spices"},{q:100,u:"g",n:"butter",a:"Dairy & Eggs"},{q:175,u:"g",n:"brown sugar",a:"Pantry"},{q:1,u:"",n:"egg",a:"Dairy & Eggs"},{q:4,u:"tbsp",n:"golden syrup",a:"Pantry"}],
        steps:"Mix flour and spices, then rub in the butter.\nStir in sugar, egg and syrup to form a dough.\nRoll out, cut shapes and bake at 180°C for 10-12 minutes."},
      {id:uid(), name:"Hot Chocolate Bar", course:"Drinks", servings:8, onMenu:true, time:"10 min",
        ingredients:[{q:1.5,u:"l",n:"milk",a:"Dairy & Eggs"},{q:200,u:"g",n:"dark chocolate",a:"Pantry"},{q:1,u:"bag",n:"mini marshmallows",a:"Pantry"},{q:1,u:"tub",n:"whipped cream",a:"Dairy & Eggs"}],
        steps:"Warm the milk gently.\nWhisk in chopped chocolate until smooth.\nServe with marshmallows and whipped cream."}
    ],
    shopChecked:{},
    shopExtra:[ {id:uid(), n:"Wrapping paper", q:"2 rolls", a:"Other", done:false}, {id:uid(), n:"Christmas crackers", q:"1 box", a:"Other", done:false} ],
    guests:[
      {id:uid(), name:"Grandma & Grandpa", size:2, rsvp:"Yes", diet:"", bringing:"Christmas pudding"},
      {id:uid(), name:"Uncle Tom's family", size:4, rsvp:"Maybe", diet:"1 vegetarian", bringing:""},
      {id:uid(), name:"Emma", size:1, rsvp:"Invited", diet:"Nut allergy", bringing:"Wine"}
    ],
    expenses:[
      {id:uid(), what:"Tree and lights", cat:"Decorations", amount:65, date:""},
      {id:uid(), what:"Card pack and stamps", cat:"Cards & Postage", amount:18, date:""}
    ],
    cards:[
      {id:uid(), name:"The Johnsons", addr:"", sent:true, recv:false},
      {id:uid(), name:"Aunt Linda", addr:"", sent:false, recv:true},
      {id:uid(), name:"Office team", addr:"", sent:false, recv:false}
    ]
  };
}

/* ---------- storage ---------- */
var state;
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ storageOK = false; }
  if(!state || typeof state !== "object" || !state.settings){ state = seed(); }
  // fill any missing parts (forward compatible)
  var d = seed();
  Object.keys(d).forEach(function(k){ if(state[k] === undefined) state[k] = d[k]; });
  Object.keys(d.settings).forEach(function(k){ if(state.settings[k] === undefined) state.settings[k] = d.settings[k]; });
  save(true);
}
function save(silent){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch(e){ storageOK = false; }
}

/* ---------- date logic ---------- */
function eventDate(){
  var now = new Date(); now.setHours(0,0,0,0);
  var m = state.settings.eventMonth-1, d = state.settings.eventDay;
  var t = new Date(now.getFullYear(), m, d);
  if(t < now) t = new Date(now.getFullYear()+1, m, d);
  return t;
}
function daysLeft(){
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((eventDate() - now)/86400000);
}
function isOverdue(t){ return !t.done && t.due && t.due < todayStr(); }

/* ---------- computed ---------- */
function giftSpent(){ return state.gifts.reduce(function(s,g){ return s + num(g.cost); },0); }
function spentByCat(){
  var o = {}; BUDGET_CATS.forEach(function(c){ o[c]=0; });
  state.expenses.forEach(function(e){ o[e.cat] = (o[e.cat]||0) + num(e.amount); });
  o["Gifts"] += giftSpent();
  return o;
}
function totalSpent(){ var o = spentByCat(); return Object.keys(o).reduce(function(s,k){ return s+o[k]; },0); }
function confirmedGuests(){ return state.guests.filter(function(g){return g.rsvp==="Yes";}).reduce(function(s,g){return s+Math.max(0,Math.round(num(g.size)));},0); }
function shoppingItems(){
  var map = {}, order = [];
  var target = Math.max(1, num(state.settings.cookingFor) || 1);
  state.recipes.forEach(function(r){
    if(!r.onMenu) return;
    var f = target / Math.max(1, num(r.servings) || 1);
    (r.ingredients||[]).forEach(function(i){
      if(!i.n || !String(i.n).trim()) return;
      var k = String(i.n).trim().toLowerCase() + "|" + String(i.u||"").trim().toLowerCase();
      if(!map[k]){ map[k] = {key:k, n:String(i.n).trim(), u:String(i.u||"").trim(), q:0, a:i.a||"Other", from:[]}; order.push(k); }

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("dark", !!state.settings.dark);
  renderNav();
  var fn = {home:vHome,tasks:vTasks,gifts:vGifts,menu:vMenu,shopping:vShopping,guests:vGuests,budget:vBudget,cards:vCards,settings:vSettings}[view] || vHome;
  document.getElementById("main").innerHTML = fn();
  var sb = document.getElementById("search");
  if(sb){ sb.addEventListener("input", function(){ search = sb.value; var pos = sb.selectionStart; render(); var n = document.getElementById("search"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }); }
  var cf = document.getElementById("cookingFor");
  if(cf){ cf.addEventListener("change", function(){ var v = Math.max(1, Math.round(num(cf.value))||1); state.settings.cookingFor = v; commit(); }); }
  bindSettings();
}
function commit(msg){ save(); render(); if(msg) toast(msg); }
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800); }

function bindSettings(){
  var n = document.getElementById("setName");
  if(!n) return;
  n.addEventListener("change", function(){ state.settings.name = n.value.trim(); commit("Saved"); });
  document.getElementById("setCur").addEventListener("change", function(e){ state.settings.currency = e.target.value; commit("Currency updated"); });
  document.getElementById("setEvent").addEventListener("change", function(e){ var p = e.target.value.split("-"); state.settings.eventMonth = +p[0]; state.settings.eventDay = +p[1]; commit("Countdown updated"); });
  document.getElementById("importFile").addEventListener("change", function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ try{ var d = JSON.parse(r.result); if(!d || !d.settings || !Array.isArray(d.tasks)) throw 0; state = d; load2(); commit("Backup restored"); }catch(err){ toast("That file isn't a planner backup"); } };
    r.readAsText(f);
  });
}
function load2(){ var d = seed(); Object.keys(d).forEach(function(k){ if(state[k]===undefined) state[k]=d[k]; }); Object.keys(d.settings).forEach(function(k){ if(state.settings[k]===undefined) state.settings[k]=d.settings[k]; }); }

  var e = !!r; r = r || {name:"",course:"Main",servings:4,time:"",onMenu:true,ingredients:[],steps:""};
  var ings = (r.ingredients.length ? r.ingredients : [null,null,null]).map(ingRow).join('');
  openModal('<h2>'+(e?'Edit recipe':'New recipe')+'</h2>'+fld('Recipe name','<input id="fName" value="'+esc(r.name)+'" maxlength="100">')+'<div class="frow">'+fld('Course','<select id="fCourse">'+opts(COURSES,r.course)+'</select>')+fld('Serves','<input id="fServ" type="number" min="1" step="1" inputmode="numeric" value="'+esc(r.servings)+'">')+'</div>'+fld('Time','<input id="fTime" value="'+esc(r.time)+'" placeholder="e.g. 45 min" maxlength="30">')+'<div class="field"><label>Ingredients</label><div id="ings">'+ings+'</div><button class="btn sm ghost" data-act="addIng" type="button">+ Ingredient</button><div class="hint">Ingredients of dishes on the menu go to your Shopping List automatically.</div></div>'+fld('Method (one step per line)','<textarea id="fSteps" maxlength="4000">'+esc(r.steps)+'</textarea>')+btns(e,'data-del-recipe="'+(r.id||'')+'"'), function(){

    var list = [];
    document.querySelectorAll("#ings .ing-row").forEach(function(row){

      list.push({q:Math.max(0,num(row.querySelector(".iq").value)), u:row.querySelector(".iu").value.trim(), n:name, a:guessAisle(name, row.querySelector(".in").getAttribute("data-aisle"))});
    });
    var o = {name:n, course:val("fCourse"), servings:Math.max(1,Math.round(num(val("fServ")))||1), time:val("fTime").trim(), ingredients:list, steps:val("fSteps")};
    if(e) Object.assign(r,o); else { o.id=uid(); o.onMenu=true; state.recipes.push(o); }
    return e?"Recipe updated":"Recipe added to menu";
  });
}
function guessAisle(name, prev){
  var s = name.toLowerCase();
  var rules = [
    ["Meat & Fish",/turkey|chicken|beef|ham|pork|lamb|salmon|fish|prawn|shrimp|bacon|sausage|duck|goose|mince/],
    ["Dairy & Eggs",/milk|butter|cream|cheese|egg|yogurt|yoghurt/],
    ["Spices",/salt|pepper|cinnamon|nutmeg|ginger|clove|spice|paprika|cumin|vanilla/],
    ["Bakery",/bread|roll|bun|pastry|baguette/],
    ["Frozen",/frozen|ice cream|peas/],
    ["Drinks",/wine|juice|soda|beer|water|cola|champagne/],
    ["Produce",/potato|onion|garlic|carrot|lemon|orange|apple|berr|herb|thyme|rosemary|sage|parsley|sprout|cabbage|lettuce|tomato|mushroom|parsnip|celery|fruit|lime|pear/],
    ["Pantry",/flour|sugar|oil|rice|pasta|stock|syrup|chocolate|honey|vinegar|nuts|oats|baking|cocoa|marshmallow/]
  ];
  for(var i=0;i<rules.length;i++) if(rules[i][1].test(s)) return rules[i][0];
  return (prev && AISLES.indexOf(prev)>=0 && prev!=="Produce") ? prev : "Other";
}
function recipeView(r){
  var f = Math.max(1,num(state.settings.cookingFor)) / Math.max(1,num(r.servings));
  var h = '<div class="course" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--berry);font-weight:700">'+esc(r.course)+'</div><h2 style="margin-top:4px">'+esc(r.name)+'</h2><div class="hint" style="margin-bottom:14px">Serves '+esc(r.servings)+(r.time?' · '+esc(r.time):'')+'</div>';
  h += '<span class="toggle '+(r.onMenu?'on':'')+'" data-menu-toggle="'+r.id+'"><span class="sw"></span>'+(r.onMenu?'On the menu':'Add to menu')+'</span>';
  h += '<h3 style="margin:18px 0 6px;font-size:17px">Ingredients</h3><div class="list">';
  if(!(r.ingredients||[]).length) h += '<div class="hint">No ingredients added.</div>';
  (r.ingredients||[]).forEach(function(i){ h += '<div class="row" style="padding:8px 2px"><div class="grow">'+esc(i.n)+'</div><span class="money">'+esc((fmtQty(num(i.q))+" "+(i.u||"")).trim())+'</span></div>'; });
  h += '</div>';
  if(r.onMenu && Math.abs(f-1)>0.01) h += '<div class="hint">On your shopping list these are scaled ×'+(Math.round(f*100)/100)+' for '+esc(state.settings.cookingFor)+' people.</div>';
  if(r.steps && r.steps.trim()){ h += '<h3 style="margin:18px 0 6px;font-size:17px">Method</h3><ol style="padding-left:20px;margin:0">'; r.steps.split("\n").filter(function(s){return s.trim();}).forEach(function(s){ h += '<li style="margin-bottom:6px">'+esc(s)+'</li>'; }); h += '</ol>'; }
  h += '<div class="actions"><button class="btn ghost" data-act="close">Close</button><button class="btn" data-edit-recipe="'+r.id+'">Edit recipe</button></div>';
  openModal(h, null);
}

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-go],[data-act],[data-tf],[data-gf],[data-rc],[data-cook],[data-toggle-task],[data-edit-task],[data-del-task],[data-cycle-gift],[data-edit-gift],[data-del-gift],[data-recipe],[data-menu-toggle],[data-edit-recipe],[data-del-recipe],[data-shop-key],[data-shop-extra],[data-del-extra],[data-cycle-rsvp],[data-edit-guest],[data-del-guest],[data-edit-exp],[data-del-exp],[data-card-sent],[data-card-recv],[data-edit-card],[data-del-card]");
  if(!t) { if(ev.target.id==="modalBg") closeModal(); return; }
  var d = t.dataset;
  if(d.go){ go(d.go); return; }
  if(d.tf){ taskFilter = d.tf; render(); return; }
  if(d.gf){ giftFilter = d.gf; render(); return; }
  if(d.rc){ recipeCourse = d.rc; render(); return; }
  if(d.cook){ state.settings.cookingFor = Math.max(1, Math.round(num(state.settings.cookingFor)) + (+d.cook)); commit(); return; }
  if(d.toggleTask){ var x = byId(state.tasks,d.toggleTask); if(x){ x.done=!x.done; commit(x.done?"Nice work! ✓":null); } return; }
  if(d.editTask){ taskForm(byId(state.tasks,d.editTask)); return; }
  if(d.delTask!==undefined){ ask("Delete this task?", function(){ removeById(state.tasks,d.delTask); commit("Task deleted"); }); return; }
  if(d.cycleGift){ var g = byId(state.gifts,d.cycleGift); if(g){ g.status = GIFT_STATUS[(GIFT_STATUS.indexOf(g.status)+1)%GIFT_STATUS.length]; commit(g.status); } return; }
  if(d.editGift){ giftForm(byId(state.gifts,d.editGift)); return; }
  if(d.delGift!==undefined){ ask("Delete this gift?", function(){ removeById(state.gifts,d.delGift); commit("Gift deleted"); }); return; }
  if(d.menuToggle){ ev.stopPropagation(); var r = byId(state.recipes,d.menuToggle); if(r){ r.onMenu=!r.onMenu; save(); var open = document.getElementById("modalBg").classList.contains("open"); render(); if(open) recipeView(r); toast(r.onMenu?"Added to menu & shopping list":"Removed from menu"); } return; }
  if(d.recipe){ var rr = byId(state.recipes,d.recipe); if(rr) recipeView(rr); return; }
  if(d.editRecipe){ recipeForm(byId(state.recipes,d.editRecipe)); return; }
  if(d.delRecipe!==undefined){ ask("Delete this recipe?", function(){ removeById(state.recipes,d.delRecipe); commit("Recipe deleted"); }); return; }
  if(d.shopKey){ if(state.shopChecked[d.shopKey]) delete state.shopChecked[d.shopKey]; else state.shopChecked[d.shopKey]=true; commit(); return; }
  if(d.shopExtra){ var se = byId(state.shopExtra,d.shopExtra); if(se){ se.done=!se.done; commit(); } return; }
  if(d.delExtra){ removeById(state.shopExtra,d.delExtra); commit("Removed"); return; }
  if(d.cycleRsvp){ var gu = byId(state.guests,d.cycleRsvp); if(gu){ gu.rsvp = RSVP[(RSVP.indexOf(gu.rsvp)+1)%RSVP.length]; commit(gu.rsvp==="Invited"?"Waiting for reply":"RSVP: "+gu.rsvp); } return; }
  if(d.editGuest){ guestForm(byId(state.guests,d.editGuest)); return; }
  if(d.delGuest!==undefined){ ask("Remove this guest?", function(){ removeById(state.guests,d.delGuest); commit("Guest removed"); }); return; }
  if(d.editExp){ expenseForm(byId(state.expenses,d.editExp)); return; }
  if(d.delExp!==undefined){ ask("Delete this expense?", function(){ removeById(state.expenses,d.delExp); commit("Expense deleted"); }); return; }
  if(d.cardSent){ var c1 = byId(state.cards,d.cardSent); if(c1){ c1.sent=!c1.sent; commit(); } return; }
  if(d.cardRecv){ var c2 = byId(state.cards,d.cardRecv); if(c2){ c2.recv=!c2.recv; commit(); } return; }
  if(d.editCard){ cardForm(byId(state.cards,d.editCard)); return; }
  if(d.delCard!==undefined){ ask("Remove this name?", function(){ removeById(state.cards,d.delCard); commit("Removed"); }); return; }
  var a = d.act;
  if(a==="close"){ closeModal(); return; }
  if(a==="yes"){ var fnY = askYes; askYes = null; closeModal(); if(fnY) fnY(); return; }
  if(a==="save"){ if(!modalSave) { closeModal(); return; } var res = modalSave(); if(res===false) return; closeModal(); commit(typeof res==="string"?res:"Saved"); return; }
  if(a==="addTask") taskForm();
  else if(a==="addGift") giftForm();
  else if(a==="addGuest") guestForm();
  else if(a==="addExpense") expenseForm();
  else if(a==="addCard") cardForm();
  else if(a==="addRecipe") recipeForm();
  else if(a==="addShop") shopForm();
  else if(a==="editBudget") budgetForm();
  else if(a==="addIng"){ document.getElementById("ings").insertAdjacentHTML("beforeend", ingRow()); var rows = document.querySelectorAll("#ings .ing-row"); rows[rows.length-1].querySelector(".iq").focus(); }
  else if(a==="rmIng"){ t.closest(".ing-row").remove(); }
  else if(a==="sumBudget"){ var s=0; BUDGET_CATS.forEach(function(c,i){ s+=num(val("fB"+i)); }); document.getElementById("fTotal").value = s; }
  else if(a==="useGuests"){ var cg = confirmedGuests(); if(cg<1){ toast("No confirmed guests yet"); return; } state.settings.cookingFor = cg; commit("Cooking for "+cg+" people"); }
  else if(a==="uncheckAll"){ state.shopChecked = {}; state.shopExtra.forEach(function(i){i.done=false;}); commit("All unchecked"); }
  else if(a==="clearDoneExtra"){ state.shopExtra = state.shopExtra.filter(function(i){return !i.done;}); commit("Cleared"); }
  else if(a==="print"){ window.print(); }
  else if(a==="more"){ var h = '<h2>More</h2><div class="more-sheet">'; VIEWS.forEach(function(v){ if(MOBILE.indexOf(v.id)<0) h += '<a data-go="'+v.id+'"><span style="font-size:22px">'+v.ico+'</span>'+esc(v.label)+'</a>'; }); h += '</div><div class="actions"><button class="btn ghost" data-act="close">Close</button></div>'; openModal(h,null); }
  else if(a==="dark"){ state.settings.dark = !state.settings.dark; commit(); }
  else if(a==="export"){ doExport(); }
  else if(a==="clearSample"){ ask("Remove all example items and start with an empty planner? Your settings stay.", function(){ var s2 = state.settings; var fresh = seed(); state = {version:1, settings:s2, budgetPlan:fresh.budgetPlan, tasks:[], gifts:[], recipes:[], shopChecked:{}, shopExtra:[], guests:[], expenses:[], cards:[]}; state.settings.sample = false; commit("Example items cleared"); }); }
  else if(a==="reset"){ ask("Start over? This deletes everything in your planner on this device.", function(){ state = seed(); commit("Planner reset"); go("home"); }, "Yes, start over"); }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape") closeModal();
  if(e.key==="Enter" && document.getElementById("modalBg").classList.contains("open") && e.target.tagName==="INPUT" && !e.target.closest(".ing-row") && e.target.type!=="file"){ e.preventDefault(); var b = document.querySelector('#modal [data-act="save"]'); if(b) b.click(); }
});
var askYes = null;
function ask(msg, onYes, yesLabel){
  askYes = onYes;
  openModal('<h2>Are you sure?</h2><p style="margin:0 0 6px">'+esc(msg)+'</p><div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn red" data-act="yes">'+esc(yesLabel||"Yes, delete")+'</button></div>', null);
}
function doExport(){
  try{
    var blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "christmas-planner-backup-"+todayStr()+".json"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Backup downloaded");
  }catch(e){ toast("Download not supported here"); }
}

/* ---------- start ---------- */
load();
var h0 = (location.hash||"").replace("#","");
if(VIEWS.some(function(v){return v.id===h0;})) view = h0;
render();
window.addEventListener("hashchange", function(){
  var h = (location.hash||"").replace("#","");
  if(h !== view && VIEWS.some(function(v){return v.id===h;})){ view = h; search = ""; closeModal(); render(); window.scrollTo(0,0); }
});
// refresh countdown at midnight / when returning to tab
document.addEventListener("visibilitychange", function(){ if(!document.hidden && view==="home") render(); });
})();
</script>
</body>
